<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CapCut 에이전트</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #161616;
    --border: #262626;
    --border-soft: #1e1e1e;
    --text: #e5e5e5;
    --text-dim: #8a8a8a;
    --text-faint: #525252;
    --accent: #22c55e;
    --accent-glow: rgba(34, 197, 94, 0.45);
    --accent-dim: rgba(34, 197, 94, 0.12);
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    margin: 0;
    padding: 0;
  }

  body {
    font-size: 13px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .num { font-variant-numeric: tabular-nums; }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 20px 96px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 40px;
  }

  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .track-badge {
    font-size: 11px;
    color: var(--text-faint);
  }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    margin: 0 0 10px;
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 28px 0;
  }

  /* --- drop zone --- */
  #dropzone {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align: center;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 120ms ease, color 120ms ease;
  }
  #dropzone:hover, #dropzone.drag {
    border-color: var(--accent);
    color: var(--text);
  }
  #dropzone .hint { font-size: 12px; color: var(--text-faint); margin-top: 4px; }
  #file-input { display: none; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 12px;
    padding: 3px 9px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.02);
    color: var(--text-dim);
  }

  /* --- form --- */
  label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin: 18px 0 6px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 9px 10px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text-faint); }

  .field-hint { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
  .field-hint.warn { color: var(--text); }

  details { margin-top: 20px; }
  summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--text-dim);
    list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; color: var(--text-faint); }
  details[open] summary::before { content: "▾ "; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .checkbox-row input { accent-color: var(--accent); }

  button {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    width: 100%;
    padding: 11px;
    margin-top: 28px;
    background: var(--accent);
    color: #04140a;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:disabled {
    background: var(--border);
    color: var(--text-faint);
    cursor: not-allowed;
  }
  button:not(:disabled):hover { filter: brightness(1.08); }

  /* --- stepper --- */
  #stepper { display: none; margin-top: 28px; }
  .stage-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
  }
  .dot {
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-top: 5px;
    background: var(--text-faint);
  }
  .dot.pending { background: var(--border); }
  .dot.active {
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .dot.done {
    background: var(--accent);
    box-shadow: 0 0 5px 1px var(--accent-glow);
  }
  .dot.error {
    background: transparent;
    border: 1px solid var(--text-dim);
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px var(--accent-glow); }
    50% { box-shadow: 0 0 0 6px transparent; }
  }

  .stage-body { flex: 1; min-width: 0; }
  .stage-label { font-size: 13px; color: var(--text); }
  .stage-row.pending .stage-label { color: var(--text-faint); }
  .stage-detail {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 3px;
  }
  .stage-detail.err { color: var(--text); }

  /* --- result --- */
  #result { display: none; margin-top: 28px; }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .stat-value {
    font-size: 20px;
    font-weight: 600;
    margin-top: 4px;
  }
  .stat-value.small { font-size: 15px; }

  .verify-note {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .verify-note .dot { margin-top: 6px; }
  .verify-note p { margin: 0; color: var(--text-dim); }
  .verify-note strong { color: var(--text); font-weight: 600; }

  .path-chip {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.02);
    color: var(--text-dim);
    margin-top: 10px;
    word-break: break-all;
    user-select: all;
  }

  .error-line {
    margin-top: 16px;
    color: var(--text-dim);
    font-size: 12px;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>CapCut 에이전트</h1>
    <span class="track-badge" id="track-badge"></span>
  </header>

  <p class="section-label">입력 영상</p>
  <div id="dropzone">
    <div id="dropzone-text">mp4 / mov 파일을 끌어놓거나 클릭해서 선택</div>
    <div class="hint">무음·잔말 구간이 빠진 점프컷 드래프트로 변환됩니다</div>
  </div>
  <input type="file" id="file-input" accept=".mp4,.mov,video/mp4,video/quicktime">
  <div id="file-chip" style="margin-top:12px; display:none;"></div>

  <form id="job-form">
    <label for="draft-name">드래프트 이름</label>
    <input type="text" id="draft-name" placeholder="my_talk_jumpcut" required>

    <label for="draft-folder">CapCut 드래프트 폴더</label>
    <input type="text" id="draft-folder" placeholder="/Users/you/Movies/CapCut/User Data/Projects/com.lveditor.draft" required>
    <div class="field-hint" id="draft-folder-hint"></div>

    <details>
      <summary>고급 설정</summary>
      <div class="grid-2">
        <div>
          <label for="opt-noise">무음 임계값</label>
          <input type="text" id="opt-noise" value="-30dB">
        </div>
        <div>
          <label for="opt-min-silence">최소 무음 길이(초)</label>
          <input type="number" id="opt-min-silence" value="0.6" step="0.05" min="0">
        </div>
        <div>
          <label for="opt-padding">구간 여유(초)</label>
          <input type="number" id="opt-padding" value="0.12" step="0.01" min="0">
        </div>
        <div>
          <label for="opt-min-speech">최소 발화 길이(초)</label>
          <input type="number" id="opt-min-speech" value="0.15" step="0.01" min="0">
        </div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="opt-allow-replace">
        <label for="opt-allow-replace" style="margin:0;">같은 이름의 드래프트 덮어쓰기</label>
      </div>
    </details>

    <button type="submit" id="submit-btn" disabled>드래프트 생성 시작</button>
  </form>

  <div id="stepper"></div>

  <div id="result">
    <hr>
    <p class="section-label">결과</p>
    <div class="stats-grid">
      <div>
        <div class="stat-label">원본 길이</div>
        <div class="stat-value small num" id="stat-original">–</div>
      </div>
      <div>
        <div class="stat-label">최종 길이</div>
        <div class="stat-value small num" id="stat-final">–</div>
      </div>
      <div>
        <div class="stat-label">컷 수</div>
        <div class="stat-value num" id="stat-cuts">–</div>
      </div>
    </div>
    <div class="path-chip" id="draft-path"></div>

    <div class="verify-note">
      <span class="dot done"></span>
      <p><strong>빌드 완료 — 검증은 지금부터입니다.</strong><br>
      CapCut 앱을 열어 위 드래프트를 직접 재생하고, 컷 경계·싱크·화질을 확인하세요.</p>
    </div>
  </div>

  <div class="error-line" id="error-line" style="display:none;"></div>
</main>

<script>
const STAGE_LABELS = {
  upload: "업로드",
  silence: "무음 분석",
  draft: "드래프트 생성",
};

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("file-input");
const fileChip = document.getElementById("file-chip");
const form = document.getElementById("job-form");
const submitBtn = document.getElementById("submit-btn");
const draftNameInput = document.getElementById("draft-name");
const draftFolderInput = document.getElementById("draft-folder");
const draftFolderHint = document.getElementById("draft-folder-hint");
const stepperEl = document.getElementById("stepper");
const resultEl = document.getElementById("result");
const errorLineEl = document.getElementById("error-line");

let selectedFile = null;

function fmtSize(bytes) {
  const mb = bytes / 1_000_000;
  return mb >= 1000 ? (mb / 1000).toFixed(2) + " GB" : mb.toFixed(1) + " MB";
}

function updateSubmitState() {
  submitBtn.disabled = !(selectedFile && draftNameInput.value.trim() && draftFolderInput.value.trim());
}

function pickFile(file) {
  if (!file) return;
  if (!/\.(mp4|mov)$/i.test(file.name)) {
    alert("mp4 또는 mov 파일만 지원합니다");
    return;
  }
  selectedFile = file;
  fileChip.style.display = "block";
  fileChip.innerHTML = `<span class="chip">${file.name} · ${fmtSize(file.size)}</span>`;
  if (!draftNameInput.value.trim()) {
    draftNameInput.value = file.name.replace(/\.(mp4|mov)$/i, "") + "_jumpcut";
  }
  updateSubmitState();
}

dropzone.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", (e) => pickFile(e.target.files[0]));

["dragenter", "dragover"].forEach((ev) =>
  dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.add("drag"); })
);
["dragleave", "drop"].forEach((ev) =>
  dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.remove("drag"); })
);
dropzone.addEventListener("drop", (e) => pickFile(e.dataTransfer.files[0]));

draftNameInput.addEventListener("input", updateSubmitState);
draftFolderInput.addEventListener("input", updateSubmitState);

fetch("/api/config")
  .then((r) => r.json())
  .then((cfg) => {
    document.getElementById("track-badge").textContent = cfg.track || "";
    if (cfg.default_draft_folder) {
      draftFolderInput.value = cfg.default_draft_folder;
    }
    if (cfg.default_draft_folder && !cfg.draft_folder_exists) {
      draftFolderHint.textContent = "이 경로가 아직 없습니다 — CapCut을 한 번 실행해 드래프트를 만든 적이 있는지 확인하세요";
      draftFolderHint.classList.add("warn");
    }
    updateSubmitState();
  })
  .catch(() => {});

const stageRows = {};

function ensureStageRow(stage) {
  if (stageRows[stage]) return stageRows[stage];
  const row = document.createElement("div");
  row.className = "stage-row pending";
  row.innerHTML = `<span class="dot pending"></span>
    <div class="stage-body">
      <div class="stage-label">${STAGE_LABELS[stage] || stage}</div>
      <div class="stage-detail"></div>
    </div>`;
  stepperEl.appendChild(row);
  stageRows[stage] = row;
  return row;
}

function setStage(stage, status, detailText, isError) {
  const row = ensureStageRow(stage);
  const dot = row.querySelector(".dot");
  const detail = row.querySelector(".stage-detail");
  row.className = "stage-row " + status;
  dot.className = "dot " + (status === "start" ? "active" : status === "error" ? "error" : status);
  if (detailText !== undefined) {
    detail.textContent = detailText;
    detail.classList.toggle("err", !!isError);
  }
}

function stageDetail(stage, data) {
  if (stage === "upload") return `${data.size_mb} MB`;
  if (stage === "silence") return `보존 ${data.segments}구간 · 유지율 ${(data.kept_ratio * 100).toFixed(1)}%`;
  if (stage === "draft") return `원본 ${data.original_duration}s → 최종 ${data.final_duration}s (컷 ${data.cut_count}개)`;
  return "";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = "처리 중...";
  stepperEl.style.display = "block";
  stepperEl.innerHTML = "";
  Object.keys(stageRows).forEach((k) => delete stageRows[k]);
  resultEl.style.display = "none";
  errorLineEl.style.display = "none";

  const fd = new FormData();
  fd.append("video", selectedFile);
  fd.append("draft_name", draftNameInput.value.trim());
  fd.append("draft_folder", draftFolderInput.value.trim());
  fd.append("noise", document.getElementById("opt-noise").value);
  fd.append("min_silence", document.getElementById("opt-min-silence").value);
  fd.append("padding", document.getElementById("opt-padding").value);
  fd.append("min_speech", document.getElementById("opt-min-speech").value);
  fd.append("allow_replace", document.getElementById("opt-allow-replace").checked);

  let jobId;
  try {
    const res = await fetch("/api/jobs", { method: "POST", body: fd });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || "요청 실패");
    jobId = body.job_id;
  } catch (err) {
    errorLineEl.style.display = "block";
    errorLineEl.textContent = "오류: " + err.message;
    submitBtn.disabled = false;
    submitBtn.textContent = "드래프트 생성 시작";
    return;
  }

  const es = new EventSource(`/api/jobs/${jobId}/events`);
  es.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.stage === "complete") {
      es.close();
      submitBtn.textContent = "드래프트 생성 시작";
      submitBtn.disabled = false;
      if (msg.status === "done") {
        resultEl.style.display = "block";
        document.getElementById("draft-path").textContent = msg.data.draft_path;
      } else {
        errorLineEl.style.display = "block";
        errorLineEl.textContent = "빌드 실패 — 위 단계의 메시지를 확인하세요.";
      }
      return;
    }
    if (msg.status === "start") {
      setStage(msg.stage, "start");
    } else if (msg.status === "done") {
      setStage(msg.stage, "done", stageDetail(msg.stage, msg.data));
      if (msg.stage === "draft") {
        document.getElementById("stat-original").textContent = msg.data.original_duration + "s";
        document.getElementById("stat-final").textContent = msg.data.final_duration + "s";
        document.getElementById("stat-cuts").textContent = msg.data.cut_count;
      }
    } else if (msg.status === "error") {
      setStage(msg.stage, "error", msg.message, true);
    }
  };
  es.onerror = () => es.close();
});
</script>
</body>
</html>
